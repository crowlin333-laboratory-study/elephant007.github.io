<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sapi Studio - AI E-commerce Studio Demo</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1c1c21;
      --accent: #d4af37; /* Tono elegante tipo boutique/moda */
      --text: #f4f4f6;
      --subtext: #9ca3af;
      --border: #2e2e38;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 420px;
      background-color: var(--card-bg);
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }
    .brand-header h1 {
      font-size: 1.1rem;
      margin: 0;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .brand-header p {
      font-size: 0.8rem;
      color: var(--subtext);
      margin: 4px 0 0 0;
    }
    .main-canvas {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      background: radial-gradient(circle at center, #1a1a22 0%, #121214 100%);
    }
    label { font-size: 0.8rem; color: var(--subtext); display: block; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
    textarea, select, input {
      width: 100%;
      background: #121214;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.9rem;
    }
    textarea:focus, select:focus {
      border-color: var(--accent);
      outline: none;
    }
    .btn-generate {
      background: linear-gradient(135deg, #e5c158, #b89728);
      color: #121214;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: opacity 0.2s;
    }
    .btn-generate:hover { opacity: 0.9; }
    .preview-container {
      width: 100%;
      max-width: 550px;
      height: 650px;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #16161a;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }
    .preview-placeholder {
      text-align: center;
      padding: 20px;
      color: var(--subtext);
    }
    .preview-placeholder span { font-size: 2.5rem; display: block; margin-bottom: 10px; }
    .badge {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(0,0,0,0.7);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--accent);
    }
    .loader {
      border: 3px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="brand-header">
      <h1>Sapi Studio</h1>
      <p>Módulo de IA para Producción Textil y E-commerce</p>
    </div>

    <div>
      <label>Tipo de Ropa / Prenda</label>
      <select id="garmentType">
        <option value="hoodie">Sudadera / Hoodie Oversize</option>
        <option value="tee">Playera / Basic Tee</option>
        <option value="jacket">Chamarra / Denim Jacket</option>
        <option value="pants">Pantalón / Jogger</option>
      </select>
    </div>

    <div>
      <label>Estilo de Presentación Studio</label>
      <select id="presentationStyle">
        <option value="ghost">Ghost Mannequin (Efecto 3D flotante)</option>
        <option value="flatlay">Flat Lay (Vista cenital)</option>
        <option value="model">Maniquí de Estudio Minimalista</option>
      </select>
    </div>

    <div>
      <label>Prompt Descriptivo de la Textura y Detalles</label>
      <textarea id="promptDetails" rows="4" placeholder="Ej. Algodón peinado heavyweight, color negro mate, costuras reforzadas, alta definición en tejido..."></textarea>
    </div>

    <div>
      <label>Formato de Salida Catálogo</label>
      <select id="aspectRatio">
        <option value="4:5">4:5 (Vertical - Redes / Tienda)</option>
        <option value="1:1">1:1 (Cuadrado - Grid Estándar)</option>
      </select>
    </div>

    <button class="btn-generate" onclick="runDemoGeneration()">Generar Render Comercial</button>
  </div>

  <div class="main-canvas">
    <div class="preview-container" id="previewBox">
      <div class="badge">Vertex AI (Imagen 3) - Sapi Studio</div>
      <div class="preview-placeholder">
        <span>✨</span>
        <p>Configura los parámetros de la prenda y haz clic en "Generar Render Comercial" para visualizar la propuesta.</p>
      </div>
    </div>
  </div>

  <script>
    function runDemoGeneration() {
      const box = document.getElementById('previewBox');
      const garment = document.getElementById('garmentType').value;
      
      box.innerHTML = `
        <div class="badge">Procesando con Sapi Studio...</div>
        <div class="loader"></div>
        <p style="color: var(--subtext); font-size: 0.85rem;">Optimizando iluminación de estudio y texturas textiles...</p>
      `;

      setTimeout(() => {
        box.innerHTML = `
          <div class="badge">Render Listo [Calidad Sapi]</div>
          <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #111; color: var(--accent); font-weight: bold; flex-direction: column; gap: 10px;">
            <div style="font-size: 4rem;">🧥</div>
            <p style="color: #fff; font-size: 0.9rem; margin: 0;">Prenda: ${garment.toUpperCase()} - Ghost Mannequin Activo</p>
            <p style="color: var(--subtext); font-size: 0.75rem; margin: 0;">Textura procesada con estándar de e-commerce y control de luz.</p>
          </div>
        `;
      }, 2000);
    }
  </script>
</body>
</html>
