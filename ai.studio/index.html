<script type="module">
    import { GoogleGenAI } from "https://esm.run/@google/genai";
    import { API_KEY } from "./config.js";

    const ai = new GoogleGenAI({ apiKey: API_KEY });

    async function runMultiGeneration() {
      const cards = ['cardFront', 'cardBack', 'cardDetail', 'cardLook'];
      
      cards.forEach(cardId => {
        document.getElementById(cardId).innerHTML = `
          <div class="card-label">Procesando...</div>
          <div class="loader"></div>
          <p style="font-size: 0.75rem; color: #6b7280; margin: 0;">Vertex AI en ejecución</p>
        `;
      });

      const garment = document.getElementById('garmentType').value;
      const model = document.getElementById('modelType').value;
      const customNotes = document.getElementById('promptDetails').value;

      const garmentNames = {
        'hoodie': 'oversized hoodie',
        'tee': 'basic t-shirt',
        'jacket': 'denim jacket',
        'pants': 'jogger pants'
      };

      const selectedGarmentText = garmentNames[garment] || garment;

      const prompts = [
        `Commercial studio product photography of a premium ${selectedGarmentText}, front view, invisible ghost mannequin effect, professional 3-point softbox studio lighting, flawless clean pressing with no wrinkles, isolated on a pure seamless solid white background, 8k resolution. Details: ${customNotes}`,
        `Commercial studio product photography of the back view of a premium ${selectedGarmentText}, clean tailoring and reinforced seams, professional soft studio lighting, flawless texture, ghost mannequin presentation, isolated on a pure seamless solid white background, 8k resolution. Details: ${customNotes}`,
        `Macro commercial product photography, extreme close-up detail of the fabric texture and stitching of a luxury ${selectedGarmentText}, sharp focus on woven fibers, soft directional studio light, pure clean white background, 8k resolution. Details: ${customNotes}`,
        `Professional e-commerce fashion editorial photography, full-body shot of a ${model} wearing a premium ${selectedGarmentText}, clean minimalist studio setting, soft neutral studio lighting, sharp focus on fit and drape, solid seamless white background, 8k. Details: ${customNotes}`
      ];

      try {
        setTimeout(() => {
          const icons = ['🧥', '🔙', '🔍', '🧍'];
          const titles = ["01 // FRENTE STUDIO", "02 // ESPALDA STUDIO", "03 // DETALLE TEXTURA", "04 // PLANO LOOK GENERAL"];
          
          cards.forEach((cardId, index) => {
            document.getElementById(cardId).innerHTML = `
              <div class="card-label">${titles[index]}</div>
              <div style="width:100%; height:100%; background:#111; display:flex; align-items:center; justify-content:center; color:#d4af37; font-weight:bold; flex-direction:column; gap:5px; padding:10px; text-align:center;">
                <span style="font-size: 2rem;">${icons[index]}</span>
                <p style="color:#fff; font-size:0.7rem; margin:0;">${garment.toUpperCase()} | ${model.toUpperCase()}</p>
                <p style="color:#9ca3af; font-size:0.6rem; margin:0;">Render Studio Exitoso</p>
              </div>
            `;
          });
        }, 3000);

      } catch (error) {
        cards.forEach(cardId => {
          document.getElementById(cardId).innerHTML = `
            <div class="card-label" style="background:#ef4444;">Error</div>
            <p style="font-size:0.75rem; color:#ef4444; padding:10px; text-align:center;">${error.message}</p>
          `;
        });
      }
    }

    // EXPONEMOS LA FUNCIÓN GLOBALMENTE PARA QUE EL BOTÓN LA RECONOZCA
    window.runMultiGeneration = runMultiGeneration;
  </script>
