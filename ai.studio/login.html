<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Sapi Studio Pro</title>
  <style>
    :root {
      --panel-bg: #111827;
      --accent: #d4af37;
      --subtext: #9ca3af;
      --border-dark: #374151;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      background-color: #0b0f19;
    }

    /* FONDO DE VIDEO ESTABLE Y FLUIDO */
    .bg-video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: -1;
    }
    .bg-video-container video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      filter: contrast(120%) brightness(40%) grayscale(40%);
    }
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, rgba(17, 24, 39, 0.82), rgba(11, 15, 25, 0.90));
      mix-blend-mode: multiply;
      z-index: 0;
    }

    /* TARJETA DE ACCESO CENTRAL */
    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-dark);
      padding: 35px 30px;
      border-radius: 14px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      box-sizing: border-box;
      backdrop-filter: blur(8px);
    }
    .login-header {
      text-align: center;
      margin-bottom: 25px;
    }
    .login-header h1 {
      font-size: 1.3rem;
      color: var(--accent);
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .form-group {
      margin-bottom: 16px;
    }
    label {
      font-size: 0.7rem;
      color: var(--subtext);
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      text-transform: uppercase;
    }
    input[type="text"], input[type="password"], input[type="number"] {
      width: 100%;
      background: #1f2937;
      border: 1px solid var(--border-dark);
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.85rem;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--accent);
      outline: none;
    }

    .btn-submit {
      background: linear-gradient(135deg, #e5c158, #b89728);
      color: #121214;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      width: 100%;
      font-size: 0.8rem;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .btn-submit:hover {
      opacity: 0.9;
    }

    .whatsapp-info {
      font-size: 0.68rem;
      color: var(--subtext);
      text-align: center;
      margin-top: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- FONDO CINEMATOGRÁFICO DE VIDEO OPTIMIZADO -->
  <div class="bg-video-container">
    <video autoplay muted loop playsinline preload="auto">
      <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
      Tu navegador no soporta video HTML5.
    </video>
  </div>
  <div class="bg-overlay"></div>

  <!-- TARJETA DE ACCESO CENTRAL -->
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h1>Sapi Studio 5.1</h1>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Usuario</label>
          <input type="text" id="username" placeholder="Ingresa tu usuario..." required>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div class="form-group" id="otpGroup" style="display: none;">
          <label>Código de Seguridad (WhatsApp)</label>
          <input type="number" id="otpCode" placeholder="Ej. 482910">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Solicitar Código WhatsApp</button>
      </form>

      <div class="whatsapp-info" id="infoText">
        Por seguridad, enviaremos un código de confirmación directo a tu WhatsApp autorizado.
      </div>
    </div>
  </div>

  <script>
    let step = 1;
    let generatedOtp = "";

    function handleLogin(event) {
      event.preventDefault();
      const user = document.getElementById('username').value.trim().toLowerCase();
      const pass = document.getElementById('password').value.trim();
      const btn = document.getElementById('submitBtn');
      const otpGroup = document.getElementById('otpGroup');
      const infoText = document.getElementById('infoText');

      if (step === 1) {
        // Validación exacta: usuario 'salamandra' y contraseña 'Pachi37'
        if(user === "salamandra" && pass === "Pachi37") {
          generatedOtp = Math.floor(100000 + Math.random() * 900000);
          
          // Reemplaza con tu número real de WhatsApp (ej: 52155...)
          const tuNumeroWhatsApp = "5215560681662"; 
          const mensaje = `🔑 Tu código de acceso a Sapi Studio 5.1 es: *${generatedOtp}*`;
          const whatsappUrl = `https://wa.me/${tuNumeroWhatsApp}?text=${encodeURIComponent(mensaje)}`;
          
          window.open(whatsappUrl, '_blank');

          btn.textContent = "Verificar Código y Acceder";
          otpGroup.style.display = "block";
          infoText.innerHTML = "💬 Se abrió WhatsApp. Envía el mensaje con tu código e ingrésalo aquí.";
          step = 2;
        } else {
          alert("Usuario o contraseña incorrectos. (Usa usuario: salamandra / contraseña: Pachi37)");
        }
      } else {
        const inputCode = document.getElementById('otpCode').value.trim();
        if(inputCode === generatedOtp.toString()) {
          window.location.href = "index.html"; // Entra directo al estudio
        } else {
          alert("❌ Código incorrecto. Revisa el código que enviaste a tu WhatsApp.");
        }
      }
    }
  </script>
</body>
</html>
