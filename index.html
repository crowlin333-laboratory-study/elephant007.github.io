HTML


<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elephant007 — José Luis Rodríguez | Visual Arts & Photography</title>

  <!-- Favicon para la pestaña del navegador -->
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      background-color: #0d0d0d;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Navegación superior */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 30px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    /* Logo + Marca */
    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      height: 36px;
      width: auto;
      object-fit: contain;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .brand span {
      color: #ff3b00; /* Naranja a juego con el logo */
    }

    nav a {
      color: #cccccc;
      text-decoration: none;
      margin-left: 30px;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #ff3b00;
    }

    /* Hero contenedor con imagen de fondo */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: flex-end;
      background-image: url('DSC04784.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }

    /* Degradado optimizado para sombras y contraste */
    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(0deg, #0d0d0d 15%, rgba(13, 13, 13, 0.7) 50%, rgba(13, 13, 13, 0.35) 100%),
        linear-gradient(90deg, rgba(13, 13, 13, 0.8) 0%, rgba(13, 13, 13, 0.15) 70%);
    }

    /* Contenido de texto */
    .content {
      position: relative;
      z-index: 2;
      max-width: 780px;
      padding: 0 0 70px 8%;
    }

    h1 {
      font-size: 3.6rem;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.05;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 span {
      color: #ff3b00; /* Acento Naranja */
    }

    .subtitle {
      font-size: 1.15rem;
      color: #e0e0e0;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .tags {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.78rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.08);
      padding: 7px 16px;
      border-radius: 4px;
      border: 1px solid rgba(255, 59, 0, 0.4); /* Borde naranja sutil */
      color: #dddddd;
      transition: all 0.3s ease;
    }

    .tag:hover {
      border-color: #ff3b00;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-container">
      <img src="logo.png" alt="Elephant007 Logo" class="brand-logo">
      <div class="brand">Elephant<span>007</span></div>
    </div>
    <nav>
      <a href="#deportes">Deportes</a>
      <a href="#diseno">Diseño</a>
      <a href="#ecommerce">E-Commerce</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <section class="hero">
    <div class="content">
      <div class="subtitle">José Luis Rodríguez — Visual Arts</div>
      <h1>Sports Photography & <span>Graphic Design</span></h1>
      <div class="tags">
        <span class="tag">Fotografía Deportiva</span>
        <span class="tag">E-Commerce Product Editor</span>
        <span class="tag">Graphic Design</span>
      </div>
    </div>
  </section>

</body>
</html>
