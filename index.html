<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elephant007 — José Luis Rodríguez | Visual Arts & Photography</title>

  <!-- Favicon para la pestaña del navegador -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Lucide Icons (Iconografía vectorial de UI) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Hoja de Estilos Externa -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Encabezado libre: Solo Logo e Isotipo -->
  <header class="top-header">
    <div class="brand-container">
      <img src="logo.png" alt="Elephant007 Logo" class="brand-logo">
      <div class="brand">Elephant<span>007</span></div>
    </div>
  </header>

  <!-- Navigation Dock (Estilo macOS) -->
  <div class="dock-wrapper">
    <nav class="mac-dock">
      <a href="#deportes" class="dock-item" data-title="Fotografía">
        <i data-lucide="camera"></i>
      </a>
      <a href="#diseno" class="dock-item" data-title="Diseño">
        <i data-lucide="pencil"></i>
      </a>
      <a href="#ecommerce" class="dock-item" data-title="E-Commerce">
        <i data-lucide="shopping-bag"></i>
      </a>
      <a href="#contacto" class="dock-item" data-title="Contacto">
        <i data-lucide="mail"></i>
      </a>
    </nav>
  </div>

  <!-- Hero Principal -->
  <section class="hero">
    <div class="content">
      <div class="subtitle">José Luis Rodríguez — Visual Arts</div>
      <h1>Sports Photography & <span>Graphic Design</span></h1>
      <div class="tags">
        <span class="tag">Fotografía Deportiva</span>
        <span class="tag">E-Commerce Product Editor</span>
        <span class="tag">Graphic Design</span>
      </div>
    </div>
  </section>

  <!-- Botón Flotante de WhatsApp (Inferior Derecha) -->
  <a href="https://wa.me/525560681662" class="whatsapp-float" target="_blank" rel="noopener noreferrer" aria-label="Contacto por WhatsApp">
    <i data-lucide="message-circle"></i>
  </a>

  <!-- Script para Renderizar Iconos de Lucide -->
  <script>
    lucide.createIcons();
  </script>

</body>
</html>
