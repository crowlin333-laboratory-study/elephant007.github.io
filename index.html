<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elephant007 — José Luis Rodríguez | Visual Arts & Photography</title>

  <!-- Favicon para la pestaña del navegador -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Hoja de Estilos Externa -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Encabezado con efecto Glassmorphic y acento de medio borde -->
  <header>
    <div class="brand-container">
      <img src="logo.png" alt="Elephant007 Logo" class="brand-logo">
      <div class="brand">Elephant<span>007</span></div>
    </div>

    <!-- Navegación Escritorio -->
    <nav class="nav-desktop">
      <a href="#deportes">Deportes</a>
      <a href="#diseno">Diseño</a>
      <a href="#ecommerce">E-Commerce</a>
      <a href="#contacto">Contacto</a>
    </nav>

    <!-- Botón de Menú de Hamburguesa para Móviles -->
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Menú de Pantalla Completa para Móviles -->
  <div class="nav-mobile" id="navMobile">
    <a href="#deportes" class="mobile-link">Deportes</a>
    <a href="#diseno" class="mobile-link">Diseño</a>
    <a href="#ecommerce" class="mobile-link">E-Commerce</a>
    <a href="#contacto" class="mobile-link">Contacto</a>
  </div>

  <!-- Hero Principal -->
  <section class="hero">
    <div class="content">
      <div class="subtitle">José Luis Rodríguez — Visual Arts</div>
      <h1>Sports Photography & <span>Graphic Design</span></h1>
      <div class="tags">
        <span class="tag">Fotografía Deportiva</span>
        <span class="tag">E-Commerce Product Editor</span>
        <span class="tag">Graphic Design</span>
      </div>
    </div>
  </section>

  <!-- Script para la interacción del Menú Móvil -->
  <script>
    const menuToggle = document.getElementById('menuToggle');
    const navMobile = document.getElementById('navMobile');
    const mobileLinks = document.querySelectorAll('.mobile-link');

    menuToggle.addEventListener('click', () => {
      navMobile.classList.toggle('active');
    });

    mobileLinks.forEach(link => {
      link.addEventListener('click', () => {
        navMobile.classList.remove('active');
      });
    });
  </script>

</body>
</html>
