<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elephant007 — José Luis Rodríguez | Visual Arts & Photography</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CONTENEDOR DE LA RÁFAGA INTRO -->
  <div id="intro-loader">
    <img id="rafaga-img" src="foto1.jpg" alt="Intro Ráfaga">
    <div class="rafaga-counter"><span id="counter-num">01</span> / 10</div>
  </div>

  <!-- ENCABEZADO SUPERIOR -->
  <header class="top-header">
    <div class="brand-container">
      <img src="logo.png" alt="Elephant007 Logo" class="brand-logo">
      <div class="brand">Elephant<span>007</span></div>
    </div>

    <nav class="mac-dock-top">
      <a href="#deportes" class="dock-btn active">
        <i data-lucide="camera"></i>
        <span>Fotografía</span>
      </a>
      <a href="#diseno" class="dock-btn">
        <i data-lucide="pencil"></i>
        <span>Diseño</span>
      </a>
      <a href="#ecommerce" class="dock-btn">
        <i data-lucide="shopping-bag"></i>
        <span>E-Commerce</span>
      </a>
      <a href="#contacto" class="dock-btn">
        <i data-lucide="mail"></i>
        <span>Contacto</span>
      </a>
    </nav>
  </header>

  <!-- HERO PRINCIPAL HOME -->
  <section class="hero">
    <div class="content">
      <div class="subtitle">José Luis Rodríguez — Visual Arts</div>
      <h1>Sports Photography & <span>Graphic Design</span></h1>
      
      <a href="#deportes" class="btn-shutter">
        <svg class="shutter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9" />
          <path class="blade blade-1" d="M12 3 L16 10" />
          <path class="blade blade-2" d="M19.8 8.5 L14.5 14" />
          <path class="blade blade-3" d="M18.8 16.5 L11.5 15.5" />
          <path class="blade blade-4" d="M10 20.8 L8.2 13" />
          <path class="blade blade-5" d="M4.2 15.5 L9.5 10" />
          <path class="blade blade-6" d="M5.2 7.5 L12.5 8.5" />
        </svg>
        <span>Ver Portafolio</span>
      </a>
    </div>
  </section>

  <!-- FOOTER TAGS -->
  <footer class="footer-tags">
    <div class="tag-box">Fotografía Deportiva</div>
    <div class="tag-box">E-Commerce Product Editor</div>
    <div class="tag-box">Graphic Design</div>
  </footer>

  <!-- WHATSAPP FLOTANTE -->
  <a href="https://wa.me/525560681662" class="whatsapp-float" target="_blank" rel="noopener noreferrer" aria-label="Contacto por WhatsApp">
    <i data-lucide="message-circle"></i>
  </a>

  <script>
    lucide.createIcons();

    // RÁFAGA DE FOTOS INTRO
    const fotos = [
      'foto1.jpg', 'foto2.jpg', 'foto3.jpg', 'foto4.jpg', 'foto5.jpg',
      'foto6.jpg', 'foto7.jpg', 'foto8.jpg', 'foto9.jpg', 'DSC04784.jpg'
    ];

    let currentIndex = 0;
    const rafagaImg = document.getElementById('rafaga-img');
    const counterNum = document.getElementById('counter-num');
    const introLoader = document.getElementById('intro-loader');

    // Cambia la foto cada 150 milisegundos (efecto ráfaga cámara)
    const interval = setInterval(() => {
      currentIndex++;
      if (currentIndex < fotos.length) {
        rafagaImg.src = fotos[currentIndex];
        counterNum.textContent = String(currentIndex + 1).padStart(2, '0');
      } else {
        clearInterval(interval);
        // Transición de salida hacia el Home
        introLoader.classList.add('fade-out');
        setTimeout(() => {
          introLoader.style.display = 'none';
        }, 800);
      }
    }, 150);
  </script>

</body>
</html>
